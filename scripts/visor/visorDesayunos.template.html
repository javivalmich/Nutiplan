<title>Visor de desayunos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Mesa de revisión de la mañana: pestañas por perfil, la semana como parrilla hueco × día (la rutina se lee en filas), y la hoja del catálogo con su ficha. */
:root {
  --bg: #f8f6f0; --surface: #ffffff; --line: #e4ded0; --fg: #241f16; --muted: #6a604e;
  --accent: #8a5a12; --accent-soft: #f6ead3; --cel-a: #fdf7ea; --cel-b: #f3f6ee; --aviso: #a3361f;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #17140e; --surface: #201c14; --line: #3a3326; --fg: #efe9dc; --muted: #b0a690;
  --accent: #e6b45f; --accent-soft: #3a2c13; --cel-a: #2a2416; --cel-b: #1f2519; --aviso: #f08a6e; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #17140e; --surface: #201c14; --line: #3a3326; --fg: #efe9dc; --muted: #b0a690;
  --accent: #e6b45f; --accent-soft: #3a2c13; --cel-a: #2a2416; --cel-b: #1f2519; --aviso: #f08a6e; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: 20px 48px }
.marco { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px }
h1 { font-family: var(--display); font-size: clamp(1.6rem, 3vw, 2.2rem); line-height: 1.1; margin: 0; text-wrap: balance }
.sub { color: var(--muted); margin: 6px 0 0; max-width: 72ch }
.pestanas, .chips { display: flex; flex-wrap: wrap; gap: 8px }
button { font: inherit; color: inherit; cursor: pointer }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.pestana { border: 1.5px solid var(--line); background: var(--surface); padding: 8px 16px; border-radius: 999px; font-weight: 700 }
.pestana[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg) }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 4px 11px; border-radius: 999px; font-size: 13px; font-variant-numeric: tabular-nums }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 700 }
.quien { color: var(--muted); font-size: 14px; margin: 0 }
.resumen { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums }
.resumen b { color: var(--fg) }
.mal { color: var(--aviso) }
.rejilla { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface) }
table { border-collapse: collapse; width: 100%; min-width: 900px; table-layout: fixed }
th, td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 8px 10px; vertical-align: top; text-align: left }
tr > :last-child { border-right: 0 }
tbody tr:last-child > * { border-bottom: 0 }
thead th { font-family: var(--display); font-size: .95rem; background: var(--bg) }
th.hueco { width: 110px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); background: var(--bg) }
td.a { background: var(--cel-a) } td.b { background: var(--cel-b) } td.f { background: var(--accent-soft) }
summary { list-style: none; cursor: pointer; display: flex; flex-direction: column; gap: 2px }
summary::-webkit-details-marker { display: none }
.titulo { font-weight: 700; font-size: 14px; line-height: 1.3 }
.cifras { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums }
.detalle { font-size: 13px; display: flex; flex-direction: column; gap: 6px; padding-top: 8px }
.detalle p { margin: 0 }
.detalle .p2 { color: var(--muted) }
.detalle h4 { margin: 4px 0 0; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted) }
.detalle ul, .detalle ol { margin: 0; padding-left: 18px }
.leyenda { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted) }
.leyenda i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line); vertical-align: -1px; margin-right: 5px }
.porque { font-size: 13px; color: var(--muted); margin: 0; padding-left: 18px }
.hoja { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px }
.ficha-plato { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0 }
.ficha-plato h3 { font-family: var(--display); font-size: 1.05rem; margin: 0; text-wrap: balance }
.ficha { display: flex; flex-wrap: wrap; gap: 6px }
.ficha span { font-size: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; color: var(--muted) }
.ficha .si { color: var(--accent); border-color: var(--accent) }
.pie { color: var(--muted); font-size: 13px }
</style>

<div class="marco">
  <header>
    <h1>Desayunos y tentempiés de engine2</h1>
    <p class="sub" id="sub"></p>
  </header>
  <nav class="pestanas" role="tablist" id="pestanas"></nav>
  <section id="vista"></section>
  <p class="pie" id="pie"></p>
</div>

<script>
const DATOS = /*__DATOS__*/null;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const PESTANAS = [...DATOS.perfiles.map((p) => [p.id, p.nombre]), ['catalogo', 'Catálogo']];
const leer = (k, d) => { try { return localStorage.getItem(k) || d; } catch { return d; } };
const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch { /* sin almacenamiento */ } };
let pestana = (location.hash || '').slice(1) || leer('visor-desayunos-pestana', 'omnivora');
if (!PESTANAS.some(([k]) => k === pestana)) pestana = 'omnivora';
const semanaSel = {};
let filtro = 'todos';

$('#sub').textContent = `${DATOS.semanas} semanas seguidas de cada perfil, como las genera la app. Cada fila es un hueco del día: se ve la rutina (dos desayunos de diario alternos y otro el fin de semana; dos tentempiés alternos) y cómo cambia de una semana a otra. Toca un desayuno para ver la compra con las cantidades ya ajustadas y la receta.`;
$('#pie').textContent = `Generado el ${DATOS.generado} desde ${DATOS.head}. Kcal y proteína de cada comida medidas con BEDCA; en el catálogo, a las cantidades escritas (unas 2000 kcal).`;

function detalle(c) {
  return `<div class="detalle">
    ${c.p1 ? `<p>${esc(c.p1)}</p>` : ''}${c.p2 ? `<p class="p2">${esc(c.p2)}</p>` : ''}
    ${c.compra && c.compra.length ? `<h4>Compra</h4><ul>${c.compra.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
    ${c.receta && c.receta.length ? `<h4>Receta</h4><ol>${c.receta.map((x) => `<li>${esc(x)}</li>`).join('')}</ol>` : ''}
  </div>`;
}

function vistaPerfil(p) {
  const s = p.semanas.find((x) => x.semana === semanaSel[p.id]) || p.semanas[0];
  const chips = p.semanas.map((x) => `<button class="chip" aria-pressed="${x.semana === s.semana}" data-semana="${x.semana}">Semana ${x.semana}</button>`).join('');
  const resumen = `<div class="resumen">
    <span>Calorías de la semana: <b>${s.desvio > 0 ? '+' : ''}${s.desvio} %</b> sobre ${p.kcal} kcal</span>
    <span class="${s.cortos ? 'mal' : ''}">Desayunos por debajo de la proteína mínima: <b>${s.cortos}</b></span>
  </div>`;
  const clase = (fila, i, c) => {
    if (!c) return '';
    if (fila.hueco === 'Desayuno' && i >= 5) return 'f';
    const primero = fila.celdas.find(Boolean);
    return c.titulo === primero.titulo ? 'a' : 'b';
  };
  const filas = s.filas.map((f) => `<tr><th class="hueco" scope="row">${esc(f.hueco)}</th>${f.celdas.map((c, i) => `<td class="${clase(f, i, c)}">${c ? `<details><summary><span class="titulo">${esc(c.titulo)}</span><span class="cifras">${c.kcal} kcal · ${c.prot} g</span></summary>${detalle(c)}</details>` : '—'}</td>`).join('')}</tr>`).join('');
  return `<div style="display:flex;flex-direction:column;gap:12px">
    <p class="quien">${esc(p.quien)}</p>
    <div class="chips">${chips}</div>${resumen}
    <div class="leyenda"><span><i style="background:var(--cel-a)"></i>primero de la rutina</span><span><i style="background:var(--cel-b)"></i>segundo de la rutina</span><span><i style="background:var(--accent-soft)"></i>desayuno del fin de semana</span></div>
    <div class="rejilla"><table><thead><tr><th class="hueco"></th>${s.dias.map((d) => `<th scope="col">${esc(d)}</th>`).join('')}</tr></thead><tbody>${filas}</tbody></table></div>
    <details><summary class="cifras">Por qué se eligió cada uno (escalón de la regla)</summary><ul class="porque">${s.rutina.map((r) => `<li>${esc(r)}</li>`).join('')}</ul></details>
  </div>`;
}

function vistaCatalogo() {
  const filtros = [['todos', 'Todos'], ['desayuno', 'Desayunos'], ['tentempie', 'Tentempiés'], ['dieta', 'Solo vegetarianos y veganos']];
  const chips = filtros.map(([k, t]) => `<button class="chip" aria-pressed="${k === filtro}" data-filtro="${k}">${t}</button>`).join('');
  const lista = DATOS.catalogo.filter((c) => filtro === 'todos' || (filtro === 'dieta' ? c.soloDieta : c.tipo === filtro));
  const tarjetas = lista.map((c) => `<article class="ficha-plato">
    <div class="ficha"><span>${c.tipo === 'desayuno' ? 'desayuno' : 'tentempié'}</span>${c.tipo === 'desayuno' ? `<span>${c.tiempo} min</span>${c.rapido ? '<span class="si">rápido</span>' : ''}${c.finde ? '<span class="si">fin de semana</span>' : ''}${c.proteico ? '' : '<span>poca proteína ajustable</span>'}` : (c.llevar ? '<span class="si">para llevar</span>' : '')}${c.soloDieta ? '<span>solo con dieta</span>' : ''}<span>base: ${esc(c.base)}</span></div>
    <h3>${esc(c.titulo)}</h3><span class="cifras">${c.kcal} kcal · ${c.prot} g de proteína tal como está escrito</span>${detalle(c)}</article>`).join('');
  return `<div style="display:flex;flex-direction:column;gap:14px"><div class="chips">${chips}</div><p class="quien">${lista.length} de ${DATOS.catalogo.length}</p><div class="hoja">${tarjetas}</div></div>`;
}

function pintar() {
  $('#pestanas').innerHTML = PESTANAS.map(([k, t]) => `<button class="pestana" role="tab" aria-selected="${k === pestana}" data-pestana="${k}">${t}</button>`).join('');
  $('#vista').innerHTML = pestana === 'catalogo' ? vistaCatalogo() : vistaPerfil(DATOS.perfiles.find((p) => p.id === pestana));
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.pestana) { pestana = b.dataset.pestana; guardar('visor-desayunos-pestana', pestana); }
  else if (b.dataset.semana) semanaSel[pestana] = Number(b.dataset.semana);
  else if (b.dataset.filtro) filtro = b.dataset.filtro;
  else return;
  pintar();
});
pintar();
</script>
