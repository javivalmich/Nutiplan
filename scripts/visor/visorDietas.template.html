<title>Visor de menús vegetales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Mesa de revisión: cabecera, pestañas por dieta, semana en rejilla de días; cada plato se despliega con su receta. */
:root {
  --bg: #f6f7f2; --surface: #ffffff; --line: #dfe3d6; --fg: #1f2419; --muted: #5d6652;
  --accent: #5e6b1f; --accent-soft: #eef1dc; --nuevo: #8a4b12; --nuevo-soft: #fbeedd; --aviso: #a3361f;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15180f; --surface: #1d2116; --line: #343a28; --fg: #e9ecdf; --muted: #a3ab93;
  --accent: #b9c96a; --accent-soft: #2a3117; --nuevo: #f0b072; --nuevo-soft: #3a2817; --aviso: #f08a6e; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15180f; --surface: #1d2116; --line: #343a28; --fg: #e9ecdf; --muted: #a3ab93;
  --accent: #b9c96a; --accent-soft: #2a3117; --nuevo: #f0b072; --nuevo-soft: #3a2817; --aviso: #f08a6e; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: 20px 48px }
.marco { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px }
h1 { font-family: var(--display); font-size: clamp(1.6rem, 3vw, 2.2rem); line-height: 1.1; margin: 0; text-wrap: balance }
.sub { color: var(--muted); margin: 6px 0 0; max-width: 70ch }
.pestanas, .chips { display: flex; flex-wrap: wrap; gap: 8px }
button { font: inherit; color: inherit; cursor: pointer }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.pestana { border: 1.5px solid var(--line); background: var(--surface); padding: 8px 16px; border-radius: 999px; font-weight: 700 }
.pestana[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg) }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 4px 11px; border-radius: 999px; font-size: 13px; font-variant-numeric: tabular-nums }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 700 }
.resumen { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums }
.resumen b { color: var(--fg) }
.mal { color: var(--aviso) }
.semana { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px }
.dia { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0 }
.dia h3 { font-family: var(--display); font-size: 1.05rem; margin: 0 }
details { border-top: 1px solid var(--line); padding-top: 8px }
details:first-of-type { border-top: 0; padding-top: 0 }
summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px }
summary::-webkit-details-marker { display: none }
.momento { grid-column: 1 / -1; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted) }
.titulo { font-weight: 700; min-width: 0 }
.cifras { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; align-self: start; padding-top: 2px }
.nuevo { display: inline-block; font-size: 11px; font-weight: 700; color: var(--nuevo); background: var(--nuevo-soft); border-radius: 4px; padding: 0 6px; margin-left: 6px; vertical-align: 1px }
.detalle { font-size: 14px; color: var(--fg); display: flex; flex-direction: column; gap: 6px; padding: 8px 0 2px }
.detalle p { margin: 0 }
.detalle .p2 { color: var(--muted) }
.detalle h4 { margin: 4px 0 0; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted) }
.detalle ul, .detalle ol { margin: 0; padding-left: 20px }
.platos { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px }
.plato { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0 }
.plato h3 { font-family: var(--display); font-size: 1.1rem; margin: 0; text-wrap: balance }
.ficha { display: flex; flex-wrap: wrap; gap: 6px }
.ficha span { font-size: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; color: var(--muted) }
.ficha .dieta { color: var(--accent); border-color: var(--accent) }
.pie { color: var(--muted); font-size: 13px }
@media (prefers-reduced-motion: no-preference) { details[open] .detalle { animation: abrir .15s ease-out } @keyframes abrir { from { opacity: .4 } to { opacity: 1 } } }
</style>

<div class="marco">
  <header>
    <h1>Menús vegetarianos y veganos</h1>
    <p class="sub" id="sub"></p>
  </header>
  <nav class="pestanas" role="tablist" id="pestanas"></nav>
  <section id="vista"></section>
  <p class="pie" id="pie"></p>
</div>

<script>
const DATOS = /*__DATOS__*/null;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const PESTANAS = [['vegetariana', 'Vegetariana'], ['vegana', 'Vegana'], ['platos', 'Platos nuevos']];
const leer = (k, d) => { try { return localStorage.getItem(k) || d; } catch { return d; } };
const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch { /* sin almacenamiento */ } };
let pestana = (location.hash || '').slice(1) || leer('visor-dietas-pestana', 'vegetariana');
if (!PESTANAS.some(([k]) => k === pestana)) pestana = 'vegetariana';
const semanaSel = { vegetariana: 1, vegana: 1 };
let filtroPlatos = 'todos';

$('#sub').textContent = `Diez semanas seguidas de cada dieta, como las genera la app, para ${DATOS.perfil} (${DATOS.kcal} kcal al día). Toca un plato para ver su preparación, la compra con las cantidades ya ajustadas y la receta. «Nuevo» marca lo redactado para estas dietas.`;
$('#pie').textContent = `Generado el ${DATOS.generado} desde ${DATOS.head}. Las kcal y la proteína de cada comida salen del medidor (BEDCA).`;

function detalle(c) {
  return `<div class="detalle">
    ${c.p1 ? `<p>${esc(c.p1)}</p>` : ''}${c.p2 ? `<p class="p2">${esc(c.p2)}</p>` : ''}
    ${c.compra && c.compra.length ? `<h4>Compra</h4><ul>${c.compra.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
    ${c.receta && c.receta.length ? `<h4>Receta</h4><ol>${c.receta.map((x) => `<li>${esc(x)}</li>`).join('')}</ol>` : ''}
  </div>`;
}

function vistaSemana(dieta) {
  const semanas = DATOS.dietas[dieta];
  const s = semanas.find((x) => x.semana === semanaSel[dieta]) || semanas[0];
  const chips = semanas.map((x) => `<button class="chip" aria-pressed="${x.semana === s.semana}" data-semana="${x.semana}">Semana ${x.semana}</button>`).join('');
  const resumen = `<div class="resumen">
    <span>Calorías de la semana: <b>${s.desvio > 0 ? '+' : ''}${s.desvio} %</b> sobre el objetivo</span>
    <span class="${s.cortas ? 'mal' : ''}">Comidas principales por debajo de ${s.minProt} g de proteína: <b>${s.cortas}</b></span>
    <span>Desayunos o tentempiés cambiados: <b>${s.cambios}</b></span>
  </div>`;
  const dias = s.dias.map((d) => `<article class="dia"><h3>${esc(d.dia)}</h3>${d.comidas.map((c) => `
    <details><summary><span class="momento">${esc(c.momento)}</span><span class="titulo">${esc(c.titulo)}${c.nuevo ? '<span class="nuevo">nuevo</span>' : ''}</span>${c.libre ? '<span class="cifras">libre</span>' : `<span class="cifras">${c.kcal} kcal · ${c.prot} g</span>`}</summary>${c.libre ? '' : detalle(c)}</details>`).join('')}</article>`).join('');
  return `<div class="chips" style="margin-bottom:12px">${chips}</div>${resumen}<div class="semana" style="margin-top:14px">${dias}</div>`;
}

function vistaPlatos() {
  const filtros = [['todos', 'Todos'], ['vegana', 'Veganos'], ['vegetariana', 'Solo vegetarianos'], ['desayunos', 'Desayunos y tentempiés']];
  const chips = filtros.map(([k, t]) => `<button class="chip" aria-pressed="${k === filtroPlatos}" data-filtro="${k}">${t}</button>`).join('');
  let tarjetas;
  if (filtroPlatos === 'desayunos') {
    tarjetas = DATOS.desayunos.map((d) => `<article class="plato"><div class="ficha"><span class="dieta">vegano</span><span>${esc(d.momento)}</span></div><h3>${esc(d.titulo)}</h3>${detalle(d)}</article>`).join('');
  } else {
    const lista = DATOS.platos.filter((p) => filtroPlatos === 'todos' || p.dieta === filtroPlatos);
    tarjetas = lista.map((p) => `<article class="plato">
      <div class="ficha"><span class="dieta">${p.dieta === 'vegana' ? 'vegano' : 'vegetariano'}</span><span>${p.momento.join(' y ')}</span><span>${esc(p.proteina.replace('_', ' '))}</span><span>${p.tiempo} min</span>${p.batch ? `<span>se guarda ${p.dias} días</span>` : ''}</div>
      <h3>${esc(p.titulo)}</h3>${detalle(p)}</article>`).join('');
  }
  return `<div class="chips" style="margin-bottom:14px">${chips}</div><div class="platos">${tarjetas}</div>`;
}

function pintar() {
  $('#pestanas').innerHTML = PESTANAS.map(([k, t]) => `<button class="pestana" role="tab" aria-selected="${k === pestana}" data-pestana="${k}">${t}</button>`).join('');
  $('#vista').innerHTML = pestana === 'platos' ? vistaPlatos() : vistaSemana(pestana);
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.pestana) { pestana = b.dataset.pestana; guardar('visor-dietas-pestana', pestana); }
  else if (b.dataset.semana) semanaSel[pestana] = Number(b.dataset.semana);
  else if (b.dataset.filtro) filtroPlatos = b.dataset.filtro;
  else return;
  pintar();
});
pintar();
</script>
